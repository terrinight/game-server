<!DOCTYPE html>
<html>
<head>
    <title>Rắn Săn Táo - Tẻi</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; background: #2c3e50; color: white; }
        canvas { border: 2px solid white; background: #ecf0f1; margin-top: 20px; box-shadow: 0 0 10px #000; }
    </style>
</head>
<body>
    <h1>Game Rắn Săn Táo</h1>
    <h2 id="scoreText">Điểm: 0</h2>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p>Dùng <b>phím mũi tên</b> để di chuyển.</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("scoreText");
        const CELL_SIZE = 40;

        // BƯỚC QUAN TRỌNG: Thay đường link wss:// dưới đây bằng link máy chủ Render của bạn!
        // Ví dụ: wss://game-cua-tei.onrender.com
        const socket = new WebSocket("wss://ran-test.onrender.com");

        socket.onopen = () => { console.log("Đã kết nối máy chủ!"); };

        socket.onmessage = (event) => {
            const state = JSON.parse(event.data);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Vẽ táo
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(state.apple.x * CELL_SIZE, state.apple.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            
            // Vẽ người chơi
            ctx.fillStyle = "#2980b9";
            ctx.fillRect(state.player.x * CELL_SIZE, state.player.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            
            scoreText.innerText = "Điểm: " + state.score;
        };

        document.addEventListener("keydown", (e) => {
            let action = null;
            if (e.key === "ArrowUp") action = "up";
            if (e.key === "ArrowDown") action = "down";
            if (e.key === "ArrowLeft") action = "left";
            if (e.key === "ArrowRight") action = "right";
            if (action) socket.send(JSON.stringify({ action: action }));
        });
    </script>
</body>
</html>
